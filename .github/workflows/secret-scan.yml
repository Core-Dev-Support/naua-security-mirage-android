name: Secret Scan

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Guard against committed secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:

          fetch-depth: 0

      - name: Project-specific secret guard
        run: bash scripts/check-no-hardcoded-secrets.sh

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.44.4

      - name: Text encoding guard
        run: |
          deno run --allow-read scripts/check-text-encoding.js app/src
          deno run --allow-read scripts/check-text-encoding.js desktop/src

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.24.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan committed history
        run: |
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7
