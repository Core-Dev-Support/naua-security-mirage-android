name: pages

# Публикует только страницу подключения (docs/connect) на GitHub Pages.
# Нужна, чтобы ссылка из бота открывалась как обычный сайт, а не скачивалась
# файлом: у Edge Functions и Storage Supabase Content-Type принудительно
# text/plain, а GitHub Pages отдаёт text/html.
#
# Адрес: https://core-dev-support.github.io/naua-security-mirage-android/

on:
  push:
    branches: [main]
    paths:
      - "docs/connect/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/connect
      - id: deployment
        uses: actions/deploy-pages@v4
