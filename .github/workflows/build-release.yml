name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        default: true
        type: boolean
      release_tag:
        description: 'Release Tag'
        required: false
        default: 'v1.1.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Restore Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/mirage-release.jks

      - name: Restore google-services.json from Secrets
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > app/google-services.json
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Optimize Gradle Properties for Cloud Runner
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties || true
          sed -i '/org.gradle.jvmargs/d' gradle.properties || true
          echo "org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC" >> gradle.properties

      - name: Build Release APK with R8
        env:
          MIRAGE_STORE_PASSWORD: ${{ secrets.MIRAGE_STORE_PASSWORD }}
          MIRAGE_KEY_PASSWORD: ${{ secrets.MIRAGE_KEY_PASSWORD }}
          MIRAGE_KEY_ALIAS: ${{ secrets.MIRAGE_KEY_ALIAS }}
        run: |
          START_TIME=$(date +%s)
          echo "========================================================="
          echo "🚀 Starting Release Build on GitHub Cloud Server..."
          echo "========================================================="
          ./gradlew assembleRelease --stacktrace
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          MINUTES=$((DURATION / 60))
          SECONDS=$((DURATION % 60))
          echo "========================================================="
          echo "⏱️ BUILD SUCCESSFUL!"
          echo "⏱️ Total build time on GitHub: ${MINUTES}m ${SECONDS}s (${DURATION} seconds)"
          echo "========================================================="

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAUA-Security-Mirage-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Prepare Release Asset
        run: |
          VERSION_TAG="${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v1.1.0' }}"
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/NAUA-Security-Mirage-${VERSION_TAG}.apk"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true' || github.event.inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v1.1.0' }}
          name: NAUA Security Mirage ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v1.1.0' }}
          files: |
            app/build/outputs/apk/release/NAUA-Security-Mirage-*.apk
            app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true