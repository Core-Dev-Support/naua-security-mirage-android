name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release Tag'
        required: false
        default: 'v1.4.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Verify No Plaintext Secrets in Source Code
        env:
          CHECK_PWD: ${{ secrets.THREE_X_UI_PASSWORD }}
          CHECK_HOST: ${{ secrets.FRANCE_HOST }}
          CHECK_PBK: ${{ secrets.FRANCE_PBK }}
        run: |
          echo "Scanning source code for plaintext credentials..."
          FAILED=0
          if [ -n "$CHECK_PWD" ] && git grep -q -F "$CHECK_PWD" -- ':!app/src/main/assets/geo/*' ':!desktop/Core/geo*' ':!.github/*'; then
            echo "❌ [SECURITY VIOLATION] Secret password found in source code!"
            FAILED=1
          fi
          if [ -n "$CHECK_HOST" ] && git grep -q -F "$CHECK_HOST" -- ':!app/src/main/assets/geo/*' ':!desktop/Core/geo*' ':!.github/*'; then
            echo "❌ [SECURITY VIOLATION] Server IP found in source code!"
            FAILED=1
          fi
          if [ -n "$CHECK_PBK" ] && git grep -q -F "$CHECK_PBK" -- ':!app/src/main/assets/geo/*' ':!desktop/Core/geo*' ':!.github/*'; then
            echo "❌ [SECURITY VIOLATION] Reality key found in source code!"
            FAILED=1
          fi
          if [ $FAILED -ne 0 ]; then
            exit 1
          fi
          echo "✅ Security verification passed: Zero plaintext secrets in repository."

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/mirage-release.jks

      - name: Restore google-services.json from Secrets
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > app/google-services.json
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Optimize Gradle Properties for Cloud Runner
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties || true
          sed -i '/org.gradle.jvmargs/d' gradle.properties || true
          echo "org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC" >> gradle.properties

      - name: Check YooMoney edge function
        uses: denoland/setup-deno@v2
        with:
          deno-version: '1.44.4'

      - name: Type-check YooMoney edge function
        run: deno check supabase/functions/yoomoney-webhook/index.ts


      - name: Type-check france-config edge function
        run: deno check supabase/functions/france-config/index.ts

      - name: Type-check finland-config edge function
        run: deno check supabase/functions/finland-config/index.ts

      - name: Type-check free-trial edge function
        run: deno check supabase/functions/free-trial/index.ts

      - name: Test free-trial contract
        run: deno test supabase/functions/free-trial/lib/trial_test.ts

      - name: Type-check belarus-config edge function
        run: deno check supabase/functions/belarus-config/index.ts

      - name: Type-check Telegram edge functions
        run: |
          deno check supabase/functions/telegram-bot/index.ts
          deno check supabase/functions/telegram-auth/index.ts
          deno check supabase/functions/telegram-subscription/index.ts
          deno check supabase/functions/yoomoney-webhook/index.ts

      - name: Test YooMoney edge-function contracts
        run: deno test supabase/functions/yoomoney-webhook/contract_test.ts

      - name: Test Telegram edge-function contracts
        run: |
          deno test supabase/functions/telegram-subscription/lib/subscription_test.ts
          deno test supabase/functions/telegram-bot/lib/subscription_test.ts

      # --allow-read нужен тесту переводов: он читает исходники бота и
      # проверяет, что ключи есть в обоих языках и нет удвоенных эмодзи.
      # --allow-env нужен тесту тарифов: он подставляет номер кошелька.
      - name: Test bot translations, tariffs, keyboards and referral rules
        run: |
          deno test --allow-read --allow-env \
            supabase/functions/telegram-bot/lib/i18n_test.ts \
            supabase/functions/telegram-bot/lib/plans_test.ts \
            supabase/functions/telegram-bot/lib/telegram_test.ts \
            supabase/functions/telegram-bot/lib/referral_test.ts \
            supabase/functions/telegram-auth/lib/trial_test.ts

      - name: Validate live-check script
        run: bash -n .github/scripts/live_subscription_check.sh

      - name: Check string resources
        run: deno run --allow-read scripts/check-string-resources.js

      - name: Verify source rules
        run: bash scripts/check-no-hardcoded-secrets.sh

      - name: Check text encoding
        run: |
          deno run --allow-read scripts/check-text-encoding.js app/src
          deno run --allow-read scripts/check-text-encoding.js desktop/src
          deno run --allow-read scripts/check-text-encoding.js scripts
          deno run --allow-read scripts/check-text-encoding.js .github
          deno run --allow-read scripts/check-text-encoding.js supabase

      - name: Run Android Unit Tests
        run: |
          ./gradlew testDebugUnitTest --stacktrace

      - name: Build Release APK with R8
        env:
          MIRAGE_STORE_PASSWORD: ${{ secrets.MIRAGE_STORE_PASSWORD }}
          MIRAGE_KEY_PASSWORD: ${{ secrets.MIRAGE_KEY_PASSWORD }}
          MIRAGE_KEY_ALIAS: ${{ secrets.MIRAGE_KEY_ALIAS }}
          THREE_X_UI_BASE_URL: ${{ secrets.THREE_X_UI_BASE_URL }}
          THREE_X_UI_USERNAME: ${{ secrets.THREE_X_UI_USERNAME }}
          THREE_X_UI_PASSWORD: ${{ secrets.THREE_X_UI_PASSWORD }}
          THREE_X_UI_INBOUND_ID: ${{ secrets.THREE_X_UI_INBOUND_ID }}
          FRANCE_HOST: ${{ secrets.FRANCE_HOST }}
          FRANCE_PORT: ${{ secrets.FRANCE_PORT }}
          FRANCE_PBK: ${{ secrets.FRANCE_PBK }}
          FRANCE_SNI: ${{ secrets.FRANCE_SNI }}
          FRANCE_SID: ${{ secrets.FRANCE_SID }}
          FRANCE_SPX: ${{ secrets.FRANCE_SPX }}
          FRANCE_FINGERPRINT: ${{ secrets.FRANCE_FINGERPRINT }}
          YOOMONEY_WALLET: ${{ secrets.YOOMONEY_WALLET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FRANCE_DEFAULT_UUID: ${{ secrets.FRANCE_DEFAULT_UUID }}
          FRANCE_ENDPOINTS: ${{ secrets.FRANCE_ENDPOINTS }}
          COMMIT_HASH: ${{ github.sha }}
        run: |
          START_TIME=$(date +%s)
          echo "========================================================="
          echo "🚀 Starting Release Build on GitHub Cloud Server..."
          echo "========================================================="
          ./gradlew assembleRelease --stacktrace
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          MINUTES=$((DURATION / 60))
          SECONDS=$((DURATION % 60))
          echo "========================================================="
          echo "⏱️ BUILD SUCCESSFUL!"
          echo "⏱️ Total build time on GitHub: ${MINUTES}m ${SECONDS}s (${DURATION} seconds)"
          echo "========================================================="

      - name: Check merged manifest for advertising identifiers
        run: |
          set -euo pipefail
          merged=$(find app/build/intermediates -path '*release*' -path '*merged*' -name 'AndroidManifest.xml' | head -n 1)
          if [ -z "$merged" ]; then
            echo "::error::no release merged manifest found"
            exit 1
          fi
          echo "checking $merged"


          if grep -qE 'uses-permission.*(AD_ID|ACCESS_ADSERVICES)|uses-library.*adservices' "$merged"; then
            echo "::error::the merged manifest can reach an advertising identifier"
            grep -nE 'uses-permission.*(AD_ID|ACCESS_ADSERVICES)|uses-library.*adservices' "$merged"
            exit 1
          fi
          echo "  no advertising permission, no adservices library"

          leftover=$(grep -nE 'property.*adservices' "$merged" || true)
          if [ -n "$leftover" ]; then
            echo "  note, inert and not removable through the merger:"
            echo "$leftover" | sed 's/^/    /'
          fi
          echo "  merged manifest is clean"

      - name: Require a v2 or v3 signature on every release APK
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::no release APK found"
            exit 1
          fi


          apksigner_bin=""
          if command -v apksigner >/dev/null 2>&1; then
            apksigner_bin=$(command -v apksigner)
          elif [ -n "${ANDROID_HOME:-}" ]; then
            apksigner_bin=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          elif [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            apksigner_bin=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          fi
          if [ -z "$apksigner_bin" ]; then
            echo "::error::apksigner was not found; cannot verify the signature"
            exit 1
          fi
          echo "using $apksigner_bin"

          for apk in "${apks[@]}"; do
            echo "checking $apk"
            report=$(mktemp)
            "$apksigner_bin" verify --verbose --print-certs "$apk" >"$report" 2>&1 || {
              cat "$report"
              echo "::error::apksigner refused $apk"
              exit 1
            }
            grep -v 'WARNING: META-INF' "$report" || true
            schemes=$(grep -cE 'Verified using v[23] scheme' "$report" || true)
            if [ "$schemes" -eq 0 ]; then
              echo "::error::$apk carries no v2 or v3 signature"
              exit 1
            fi
            echo "  $schemes modern signature scheme(s) present"
          done

      - name: Upload Release APKs as Artifact
        uses: actions/upload-artifact@v7
        with:
          name: NAUA-Security-Mirage-Release-APKs
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
        env:
          NODE_OPTIONS: --no-deprecation

      - name: Prepare Release Asset
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true' || github.event.inputs.create_release == true
        run: |
          VERSION_TAG="${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v1.4.0' }}"
          out="app/build/outputs/apk/release"
          for apk in "$out"/app-*-release.apk; do
            [ -f "$apk" ] || continue
            case "$(basename "$apk")" in
              app-arm64-v8a-release.apk) suffix="arm64-v8a" ;;
              app-armeabi-v7a-release.apk) suffix="armeabi-v7a" ;;
              app-universal-release.apk) continue ;;
              *) continue ;;
            esac
            cp "$apk" "$out/NAUA-Security-Mirage-${VERSION_TAG}-${suffix}.apk"
          done
          # Универсальный APK с прежним именем нужен старым клиентам 1.3.0:
          # они берут первый .apk из релиза и не умеют выбирать ABI.
          cp "$out/app-universal-release.apk" "$out/NAUA-Security-Mirage-${VERSION_TAG}.apk"
          if [ ! -f "docs/releases/${VERSION_TAG}.md" ]; then
            echo "::error::no release notes for ${VERSION_TAG} at docs/releases/${VERSION_TAG}.md"
            exit 1
          fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true' || github.event.inputs.create_release == true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v1.4.0' }}
          name: NAUA Security Mirage ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v1.4.0' }}
          body_path: docs/releases/${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v1.4.0' }}.md
          # Универсальный APK с прежним именем идёт первым: клиенты 1.3.0
          # выбирают первый .apk и должны получить совместимый файл.
          files: |
            app/build/outputs/apk/release/NAUA-Security-Mirage-${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v1.4.0' }}.apk
            app/build/outputs/apk/release/NAUA-Security-Mirage-${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v1.4.0' }}-arm64-v8a.apk
            app/build/outputs/apk/release/NAUA-Security-Mirage-${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v1.4.0' }}-armeabi-v7a.apk
          generate_release_notes: false

      - name: Notify installed apps about the new version
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true' || github.event.inputs.create_release == true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUSH_SEND_SECRET: ${{ secrets.PUSH_SEND_SECRET }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v1.4.0' }}
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_TAG}.md"
          if [ ! -f "$notes" ]; then
            echo "Release notes not found at $notes"
            exit 1
          fi
          payload=$(python3 - "$notes" "$RELEASE_TAG" <<'PY'
          import json, sys
          path, tag = sys.argv[1], sys.argv[2]
          print(json.dumps({
              "tag": tag,
              "title": "\u0414\u043e\u0441\u0442\u0443\u043f\u043d\u043e \u043e\u0431\u043d\u043e\u0432\u043b\u0435\u043d\u0438\u0435 " + tag.lstrip("vV"),
              "body": "\u041d\u0430\u0436\u043c\u0438\u0442\u0435, \u0447\u0442\u043e\u0431\u044b \u043f\u043e\u0441\u043c\u043e\u0442\u0440\u0435\u0442\u044c \u0438\u0437\u043c\u0435\u043d\u0435\u043d\u0438\u044f \u0438 \u0441\u043a\u0430\u0447\u0430\u0442\u044c",
          }, ensure_ascii=False))
          PY
          )
          echo "Sending: $(echo "$payload" | head -c 200)"
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "x-push-secret: ${PUSH_SEND_SECRET}" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "${SUPABASE_URL}/functions/v1/send-release-push")
          status=$(echo "$response" | tail -n1)
          echo "Result: $status $(echo "$response" | head -n-1)"